name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx --yes @commitlint/cli --from=origin/main --to=HEAD --verbose
        if: github.event_name == 'pull_request'
      - run: npx --yes @commitlint/cli --from=$(git rev-list --max-parents=0 HEAD) --to=HEAD --verbose

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - run: |
          curl -sSLo ktfmt.jar https://repo1.maven.org/maven2/com/facebook/ktfmt/0.61/ktfmt-0.61-with-dependencies.jar
          java -jar ktfmt.jar --kotlinlang-style --set-exit-if-changed $(find . -name '*.kt' -not -path './.gradle/*' -not -path '*/build/*')
